<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sariling Mundo Desktop Sidebar</title>
    <style>
      :root,
      [data-theme='light'] {
        --bg-card: #ffffff;
        --bg-well: #f4f5f8;
        --bg-hover: #eaedf2;
        --text-main: #0d0f14;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-subtle: #e2e5ec;
        --border-strong: #cbd5e1;
        --btn-primary-bg: #0d0f14;
        --btn-primary-fg: #ffffff;
        --btn-primary-hover: #1e2430;
        --pill-bg: #eaedf2;
        --pill-fg: #334155;
        --pill-urgent-bg: #fef2f2;
        --pill-urgent-fg: #b91c1c;
        --pill-urgent-border: #fecaca;
        --pill-work-bg: #fffbeb;
        --pill-work-fg: #b45309;
        --pill-work-border: #fde68a;
        --hand-bg: #0d0f14;
        --hand-fg: #ffffff;
        --hand-ring: rgba(13, 15, 20, 0.12);
        --shadow-card: 0 20px 50px rgba(13, 15, 20, 0.18), 0 4px 14px rgba(13, 15, 20, 0.08);
      }

      [data-theme='dark'] {
        --bg-card: #12151c;
        --bg-well: #1a1e28;
        --bg-hover: #232836;
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-subtle: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);
        --btn-primary-bg: #f8fafc;
        --btn-primary-fg: #0d0f14;
        --btn-primary-hover: #e2e8f0;
        --pill-bg: #1e2430;
        --pill-fg: #cbd5e1;
        --pill-urgent-bg: rgba(239, 68, 68, 0.14);
        --pill-urgent-fg: #fca5a5;
        --pill-urgent-border: rgba(239, 68, 68, 0.26);
        --pill-work-bg: rgba(245, 158, 11, 0.14);
        --pill-work-fg: #fcd34d;
        --pill-work-border: rgba(245, 158, 11, 0.28);
        --hand-bg: #f8fafc;
        --hand-fg: #0d0f14;
        --hand-ring: rgba(248, 250, 252, 0.14);
        --shadow-card: 0 22px 52px rgba(0, 0, 0, 0.6), 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        padding: 8px;
        width: 100%;
        height: 100%;
      }

      .panel {
        width: 100%;
        height: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 18px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: panelIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes panelIn {
        from {
          opacity: 0;
          transform: translateX(10px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      /* ── Desktop Sidebar Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 15px;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .brandGroup {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .brandLogo {
        width: 20px;
        height: 20px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .brandTitle {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--text-main);
        white-space: nowrap;
      }

      .statusChip {
        display: inline-flex;
        align-items: center;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--pill-bg);
        color: var(--pill-fg);
        border: 1px solid var(--border-subtle);
      }

      .statusChip.work {
        background: var(--pill-work-bg);
        color: var(--pill-work-fg);
        border-color: var(--pill-work-border);
      }

      .statusChip.urgent {
        background: var(--pill-urgent-bg);
        color: var(--pill-urgent-fg);
        border-color: var(--pill-urgent-border);
      }

      .headerActions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .iconBtn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
      }

      .iconBtn:hover {
        transform: scale(1.06);
        background: var(--bg-well);
        border-color: var(--border-subtle);
        color: var(--text-main);
      }

      /* ── Compact Filter Tabs ── */
      .filterTabs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 15px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-well);
        flex-shrink: 0;
      }

      .filterTab {
        flex: 1;
        height: 28px;
        padding: 0 6px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        white-space: nowrap;
        transition: all 0.15s ease;
      }

      .filterTab:hover {
        color: var(--text-main);
        background: var(--bg-hover);
      }

      .filterTab.active {
        background: var(--bg-card);
        color: var(--text-main);
        border-color: var(--border-subtle);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .tabBadge {
        font-size: 9.5px;
        font-weight: 700;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--pill-bg);
        color: var(--text-muted);
      }

      /* ── Scrollable Body ── */
      .scrollBody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 13px 15px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }

      .scrollBody::-webkit-scrollbar {
        width: 5px;
      }

      .scrollBody::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 999px;
      }

      /* ── Primary Focus Cue Card ── */
      .focusBox {
        background: var(--bg-well);
        border: 1px solid var(--border-subtle);
        border-radius: 13px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .cueRow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .handBadge {
        position: relative;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--hand-bg);
        color: var(--hand-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 0 0 4px var(--hand-ring);
      }

      .handIcon {
        width: 18px;
        height: 18px;
        will-change: transform;
      }

      .handBadge.animated .handIcon {
        animation: handNudge 1.5s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      .handBadge.animated {
        animation: ringPulse 2.2s ease-out infinite;
      }

      @keyframes handNudge {
        0%,
        100% {
          transform: translateX(-1px);
        }
        45% {
          transform: translateX(4px);
        }
        70% {
          transform: translateX(1px);
        }
      }

      @keyframes ringPulse {
        0% {
          box-shadow: 0 0 0 0 var(--hand-ring);
        }
        70% {
          box-shadow: 0 0 0 6px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .handBadge.animated,
        .handBadge.animated .handIcon {
          animation: none;
        }
      }

      .cueContent {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .cuePrompt {
        font-size: 10.8px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .cueTitle {
        font-size: 13.5px;
        font-weight: 650;
        line-height: 1.35;
        color: var(--text-main);
        letter-spacing: -0.01em;
        word-break: break-word;
      }

      .cueMeta {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      .actionRow {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btnPrimary {
        flex: 1;
        height: 31px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
        font-size: 11.8px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: background 0.14s ease, transform 0.14s ease;
      }

      .btnPrimary:hover {
        transform: translateY(-1px);
        background: var(--btn-primary-hover);
      }

      .btnPrimary:active {
        transform: scale(0.98);
      }

      .btnGhost {
        height: 31px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 11.8px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: background 0.14s ease, border-color 0.14s ease;
      }

      .btnGhost:hover {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }

      /* ── Desktop Quick-Add Form ── */
      .quickAddForm {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .quickInput {
        flex: 1;
        min-width: 0;
        height: 34px;
        padding: 0 11px;
        border-radius: 9px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-well);
        color: var(--text-main);
        font-family: inherit;
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s ease, background 0.15s ease;
      }

      .quickInput::placeholder {
        color: var(--text-muted);
      }

      .quickInput:focus {
        border-color: var(--border-strong);
        background: var(--bg-card);
      }

      .quickSubmitBtn {
        height: 34px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.14s ease, border-color 0.14s ease;
      }

      .quickSubmitBtn:hover {
        background: var(--bg-well);
        border-color: var(--border-strong);
      }

      /* ── Sidebar Sections & Rows ── */
      .sectionBlock {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .sectionHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10.8px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.045em;
        padding: 0 2px;
      }

      .sectionAction {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 10.8px;
        font-weight: 600;
        cursor: pointer;
        padding: 1px 4px;
        border-radius: 5px;
      }

      .sectionAction:hover {
        background: var(--bg-well);
        color: var(--text-main);
      }

      .queueList {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .queueItem {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.14s ease, border-color 0.14s ease;
      }

      .queueItem:hover {
        transform: translateX(3px);
        background: var(--bg-well);
        border-color: var(--border-strong);
      }

      .queueItem.doneRow {
        opacity: 0.6;
      }

      .queueItem.doneRow .queueTitle {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .checkCircle {
        width: 19px;
        height: 19px;
        border-radius: 999px;
        border: 1.5px solid var(--border-strong);
        background: transparent;
        color: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
      }

      .checkCircle:hover {
        transform: scale(1.14);
        border-color: var(--text-main);
        background: var(--bg-hover);
        color: var(--text-main);
      }

      .checkCircle.checked {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
      }

      .queueMain {
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }

      .queueTitleRow {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .queueTitle {
        font-size: 12.2px;
        font-weight: 550;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .miniTag {
        font-size: 9.5px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--pill-bg);
        color: var(--pill-fg);
        border: 1px solid var(--border-subtle);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        flex-shrink: 0;
      }

      .miniTag.urgent {
        background: var(--pill-urgent-bg);
        color: var(--pill-urgent-fg);
        border-color: var(--pill-urgent-border);
      }

      .miniTag.work {
        background: var(--pill-work-bg);
        color: var(--pill-work-fg);
        border-color: var(--pill-work-border);
      }

      .queueMeta {
        font-size: 10.8px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dismissBtn {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.55;
        flex-shrink: 0;
        transition: opacity 0.14s ease, background 0.14s ease, color 0.14s ease;
      }

      .queueItem:hover .dismissBtn {
        opacity: 1;
      }

      .dismissBtn:hover {
        background: var(--bg-hover);
        color: var(--text-main);
      }

      .emptyMini {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-well);
        font-size: 11.8px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .emptyLink {
        border: none;
        background: transparent;
        color: var(--text-main);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }

      .emptyLink:hover {
        text-decoration: underline;
      }

      /* ── Footer ── */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 15px;
        border-top: 1px solid var(--border-subtle);
        background: var(--bg-well);
        flex-shrink: 0;
      }

      .footerStat {
        font-size: 11.2px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .footerLink {
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 11.2px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 8px;
        flex-shrink: 0;
        transition: background 0.14s ease, border-color 0.14s ease;
      }

      .footerLink:hover {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div id="card" class="panel" role="dialog" aria-label="Sariling Mundo Edge Sidebar">
        <header class="header">
          <div class="brandGroup">
            <img src="logo.png" alt="Sariling Mundo" class="brandLogo" />
            <span class="brandTitle">Sariling Mundo</span>
            <span id="status-chip" class="statusChip">Ready</span>
          </div>
          <div class="headerActions">
            <button
              id="btn-expand"
              type="button"
              class="iconBtn"
              title="Open Full Desktop App"
              aria-label="Open Full Desktop App"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6" />
                <path d="M10 14 21 3" />
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              </svg>
            </button>
            <button
              id="btn-close"
              type="button"
              class="iconBtn"
              title="Collapse Edge Sidebar"
              aria-label="Collapse Edge Sidebar"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        </header>

        <!-- Category Tabs -->
        <nav id="filter-tabs" class="filterTabs" aria-label="Sidebar Views">
          <button type="button" class="filterTab active" data-tab="all">All</button>
          <button type="button" class="filterTab" data-tab="tasks">
            <span>Tasks</span>
            <span id="tab-tasks-count" class="tabBadge">0</span>
          </button>
          <button type="button" class="filterTab" data-tab="routine">
            <span>Routine</span>
            <span id="tab-routine-count" class="tabBadge">0/0</span>
          </button>
          <button type="button" class="filterTab" data-tab="reminders">
            <span>Alerts</span>
            <span id="tab-reminders-count" class="tabBadge">0</span>
          </button>
        </nav>

        <main class="scrollBody">
          <!-- Primary Focus Cue Card -->
          <section id="focus-box" class="focusBox" aria-live="polite">
            <div class="cueRow">
              <div id="hand-badge" class="handBadge animated" aria-hidden="true">
                <svg id="icon-hand" class="handIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13 10h7.5a1.5 1.5 0 0 1 0 3H14" />
                  <path d="M14 13h2.2a1.4 1.4 0 0 1 0 2.8H13.5" />
                  <path d="M13.5 15.8h1.5a1.35 1.35 0 0 1 0 2.7H10.5c-2.6 0-4.6-1.2-5.5-2.8L3.5 13V9.5c0-1 .7-1.8 1.6-2l4.4-1a2 2 0 0 1 2.2 1.2L13 10Z" />
                </svg>
                <svg id="icon-check" class="handIcon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 6 9 17l-5-5" />
                </svg>
              </div>

              <div class="cueContent">
                <div id="cue-prompt" class="cuePrompt">Hey — do the work now</div>
                <div id="cue-title" class="cueTitle">Loading workspace...</div>
                <div id="cue-meta" class="cueMeta"></div>
              </div>
            </div>

            <div id="action-row" class="actionRow">
              <button id="btn-primary" type="button" class="btnPrimary">
                <span>Mark Done</span>
              </button>
              <button id="btn-secondary" type="button" class="btnGhost hidden">
                <span>Focus Space</span>
              </button>
            </div>
          </section>

          <!-- Instant Task Capture -->
          <form id="quick-add-form" class="quickAddForm">
            <input
              id="quick-input"
              type="text"
              class="quickInput"
              placeholder="+ Add task for today..."
              autocomplete="off"
            />
            <button type="submit" class="quickSubmitBtn">Add</button>
          </form>

          <!-- Tasks & Deadlines Section -->
          <section id="tasks-section" class="sectionBlock">
            <div class="sectionHeader">
              <span>Tasks &amp; Deadlines</span>
              <button type="button" id="btn-open-tasks" class="sectionAction">View all →</button>
            </div>
            <div id="tasks-list" class="queueList"></div>
          </section>

          <!-- Daily Routine Section (Always available) -->
          <section id="routine-section" class="sectionBlock">
            <div class="sectionHeader">
              <span>Daily Routine (<span id="routine-count">0/0</span>)</span>
              <button type="button" id="btn-open-routine" class="sectionAction">Manage →</button>
            </div>
            <div id="routine-list" class="queueList"></div>
          </section>

          <!-- Reminders & Alerts Section -->
          <section id="reminders-section" class="sectionBlock">
            <div class="sectionHeader">
              <span>Reminders &amp; Alerts</span>
              <span id="reminders-count">0</span>
            </div>
            <div id="reminders-list" class="queueList"></div>
          </section>
        </main>

        <footer class="footer">
          <span id="footer-stat" class="footerStat">Synced with workspace</span>
          <button id="btn-open-app" type="button" class="footerLink">
            <span>Open Full App</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </footer>
      </div>
    </div>

    <script>
      const statusChipEl = document.getElementById('status-chip');
      const handBadgeEl = document.getElementById('hand-badge');
      const iconHandEl = document.getElementById('icon-hand');
      const iconCheckEl = document.getElementById('icon-check');
      const cuePromptEl = document.getElementById('cue-prompt');
      const cueTitleEl = document.getElementById('cue-title');
      const cueMetaEl = document.getElementById('cue-meta');
      const actionRowEl = document.getElementById('action-row');
      const btnPrimaryEl = document.getElementById('btn-primary');
      const btnSecondaryEl = document.getElementById('btn-secondary');
      const quickAddFormEl = document.getElementById('quick-add-form');
      const quickInputEl = document.getElementById('quick-input');

      const tabTasksCountEl = document.getElementById('tab-tasks-count');
      const tabRoutineCountEl = document.getElementById('tab-routine-count');
      const tabRemindersCountEl = document.getElementById('tab-reminders-count');
      const focusBoxEl = document.getElementById('focus-box');

      const tasksSectionEl = document.getElementById('tasks-section');
      const tasksListEl = document.getElementById('tasks-list');
      const routineSectionEl = document.getElementById('routine-section');
      const routineCountEl = document.getElementById('routine-count');
      const routineListEl = document.getElementById('routine-list');
      const remindersSectionEl = document.getElementById('reminders-section');
      const remindersCountEl = document.getElementById('reminders-count');
      const remindersListEl = document.getElementById('reminders-list');
      const footerStatEl = document.getElementById('footer-stat');

      let activeTab = 'all';
      let lastSnapshot = null;

      function applyTabVisibility() {
        const ready = Boolean(lastSnapshot && lastSnapshot.ready);
        if (!ready) {
          tasksSectionEl.classList.add('hidden');
          routineSectionEl.classList.add('hidden');
          remindersSectionEl.classList.add('hidden');
          return;
        }
        focusBoxEl.classList.toggle('hidden', activeTab !== 'all');
        tasksSectionEl.classList.toggle('hidden', activeTab !== 'all' && activeTab !== 'tasks');
        routineSectionEl.classList.toggle('hidden', activeTab !== 'all' && activeTab !== 'routine');
        remindersSectionEl.classList.toggle('hidden', activeTab !== 'all' && activeTab !== 'reminders');
      }

      document.querySelectorAll('.filterTab').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeTab = btn.getAttribute('data-tab') || 'all';
          document.querySelectorAll('.filterTab').forEach((b) => b.classList.toggle('active', b === btn));
          applyTabVisibility();
        });
      });

      function renderQueueRow(item) {
        const row = document.createElement('div');
        row.className = 'queueItem' + (item.isDone ? ' doneRow' : '');

        if (item.kind !== 'reminder') {
          const checkBtn = document.createElement('button');
          checkBtn.type = 'button';
          checkBtn.className = 'checkCircle' + (item.isDone ? ' checked' : '');
          checkBtn.title = item.isDone ? 'Mark incomplete' : 'Mark complete';
          checkBtn.setAttribute('aria-label', `Toggle ${item.title}`);
          checkBtn.innerHTML =
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
          checkBtn.onclick = async () => {
            checkBtn.disabled = true;
            if (item.kind === 'routine') {
              await window.sarilingPopover?.toggleRoutineBlock(item.id);
            } else {
              await window.sarilingPopover?.completeTask(item.id);
            }
          };
          row.appendChild(checkBtn);
        }

        const main = document.createElement('div');
        main.className = 'queueMain';
        main.onclick = () => window.sarilingPopover?.openWorkspace(item.href || (item.kind === 'routine' ? '/routine' : '/tasks'));

        const titleRow = document.createElement('div');
        titleRow.className = 'queueTitleRow';

        if (item.badge) {
          const tag = document.createElement('span');
          tag.className = 'miniTag' + (item.tone === 'urgent' ? ' urgent' : item.tone === 'work' ? ' work' : '');
          tag.textContent = item.badge;
          titleRow.appendChild(tag);
        }

        const title = document.createElement('div');
        title.className = 'queueTitle';
        title.textContent = item.title;
        titleRow.appendChild(title);

        main.appendChild(titleRow);

        if (item.meta) {
          const meta = document.createElement('div');
          meta.className = 'queueMeta';
          meta.textContent = item.meta;
          main.appendChild(meta);
        }

        row.appendChild(main);

        if (item.kind === 'reminder') {
          const dismissBtn = document.createElement('button');
          dismissBtn.type = 'button';
          dismissBtn.className = 'dismissBtn';
          dismissBtn.title = 'Dismiss reminder';
          dismissBtn.setAttribute('aria-label', 'Dismiss reminder');
          dismissBtn.innerHTML =
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
          dismissBtn.onclick = async (e) => {
            e.stopPropagation();
            dismissBtn.disabled = true;
            await window.sarilingPopover?.dismissReminder(item.id);
          };
          row.appendChild(dismissBtn);
        }

        return row;
      }

      function renderSnapshot(data) {
        if (!data) return;
        lastSnapshot = data;

        document.documentElement.setAttribute('data-theme', data.theme === 'dark' ? 'dark' : 'light');

        const primary = data.primary || null;
        statusChipEl.className = 'statusChip';

        if (!data.ready) {
          handBadgeEl.classList.remove('animated');
          iconHandEl.classList.remove('hidden');
          iconCheckEl.classList.add('hidden');
          statusChipEl.textContent = 'Syncing';
          cuePromptEl.textContent = 'Connecting to workspace';
          cueTitleEl.textContent = data.needsAuth ? 'Sign in to sync your edge sidebar' : 'Loading tasks & schedule...';
          cueMetaEl.textContent = data.needsAuth
            ? 'Open the full app once to sign in.'
            : 'Reading live workspace data.';
          actionRowEl.classList.remove('hidden');
          btnPrimaryEl.innerHTML = '<span>Open Full App</span>';
          btnPrimaryEl.onclick = () => window.sarilingPopover?.openWorkspace('/');
          btnSecondaryEl.classList.add('hidden');
          quickAddFormEl.classList.add('hidden');
          applyTabVisibility();
          footerStatEl.textContent = 'Sariling Mundo Desktop';
          return;
        }

        quickAddFormEl.classList.remove('hidden');

        if (primary) {
          handBadgeEl.classList.add('animated');
          iconHandEl.classList.remove('hidden');
          iconCheckEl.classList.add('hidden');

          statusChipEl.textContent = primary.badge || 'DO THIS';
          if (primary.tone === 'urgent') statusChipEl.classList.add('urgent');
          else if (primary.tone === 'work') statusChipEl.classList.add('work');

          cuePromptEl.textContent = primary.prompt || 'Hey — do the work now';
          cueTitleEl.textContent = primary.title;
          cueMetaEl.textContent = primary.meta || '';
          cueMetaEl.classList.toggle('hidden', !primary.meta);

          actionRowEl.classList.remove('hidden');
          btnPrimaryEl.innerHTML =
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
            '<span>' + (primary.kind === 'routine' ? 'Complete Block' : 'Complete Task') + '</span>';

          btnPrimaryEl.onclick = async () => {
            btnPrimaryEl.disabled = true;
            try {
              if (primary.kind === 'routine') {
                await window.sarilingPopover?.toggleRoutineBlock(primary.id);
              } else {
                await window.sarilingPopover?.completeTask(primary.id);
              }
            } finally {
              btnPrimaryEl.disabled = false;
            }
          };

          btnSecondaryEl.classList.remove('hidden');
          btnSecondaryEl.textContent = primary.kind === 'routine' ? 'Open Routine' : 'Focus Space';
          btnSecondaryEl.onclick = () => {
            window.sarilingPopover?.openWorkspace(primary.kind === 'routine' ? '/routine' : '/focus');
          };
        } else {
          handBadgeEl.classList.remove('animated');
          iconHandEl.classList.add('hidden');
          iconCheckEl.classList.remove('hidden');

          statusChipEl.textContent = 'Clear';
          cuePromptEl.textContent = 'All caught up';
          cueTitleEl.textContent = 'No pending tasks or active work blocks';
          cueMetaEl.textContent = 'Capture a quick task below or check your routine.';
          cueMetaEl.classList.remove('hidden');

          actionRowEl.classList.remove('hidden');
          btnPrimaryEl.innerHTML = '<span>+ Quick Task</span>';
          btnPrimaryEl.onclick = () => quickInputEl.focus();
          btnSecondaryEl.classList.remove('hidden');
          btnSecondaryEl.textContent = 'Open Routine';
          btnSecondaryEl.onclick = () => window.sarilingPopover?.openWorkspace('/routine');
        }

        // Tasks section
        const taskItems = Array.isArray(data.taskItems) ? data.taskItems : [];
        tabTasksCountEl.textContent = String(taskItems.length);
        tasksListEl.innerHTML = '';
        if (taskItems.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyMini';
          empty.innerHTML = '<span>No pending tasks.</span>';
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'emptyLink';
          addBtn.textContent = '+ Add';
          addBtn.onclick = () => quickInputEl.focus();
          empty.appendChild(addBtn);
          tasksListEl.appendChild(empty);
        } else {
          taskItems.forEach((item) => tasksListEl.appendChild(renderQueueRow(item)));
        }

        // Daily Routine section (always visible)
        const routineItems = Array.isArray(data.routineItems) ? data.routineItems : [];
        const rDone = data.routineSummary ? data.routineSummary.done : 0;
        const rTotal = data.routineSummary ? data.routineSummary.total : 0;
        routineCountEl.textContent = `${rDone}/${rTotal}`;
        tabRoutineCountEl.textContent = `${rDone}/${rTotal}`;
        routineListEl.innerHTML = '';
        if (rTotal === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyMini';
          empty.innerHTML = '<span>No routine blocks set.</span>';
          const setupBtn = document.createElement('button');
          setupBtn.type = 'button';
          setupBtn.className = 'emptyLink';
          setupBtn.textContent = 'Set up →';
          setupBtn.onclick = () => window.sarilingPopover?.openWorkspace('/routine');
          empty.appendChild(setupBtn);
          routineListEl.appendChild(empty);
        } else {
          routineItems.forEach((item) => routineListEl.appendChild(renderQueueRow(item)));
        }

        // Reminders & Alerts section (always visible)
        const reminderItems = Array.isArray(data.reminderItems) ? data.reminderItems : [];
        remindersCountEl.textContent = String(reminderItems.length);
        tabRemindersCountEl.textContent = String(reminderItems.length);
        remindersListEl.innerHTML = '';
        if (reminderItems.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyMini';
          empty.innerHTML = '<span>All reminders clear.</span>';
          const calBtn = document.createElement('button');
          calBtn.type = 'button';
          calBtn.className = 'emptyLink';
          calBtn.textContent = 'Calendar →';
          calBtn.onclick = () => window.sarilingPopover?.openWorkspace('/calendar');
          empty.appendChild(calBtn);
          remindersListEl.appendChild(empty);
        } else {
          reminderItems.forEach((item) => remindersListEl.appendChild(renderQueueRow(item)));
        }

        applyTabVisibility();
        footerStatEl.textContent = data.summary || 'Synced with workspace';
      }

      quickAddFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = quickInputEl.value.trim();
        if (!title) return;
        quickInputEl.disabled = true;
        try {
          await window.sarilingPopover?.addTask(title);
          quickInputEl.value = '';
        } finally {
          quickInputEl.disabled = false;
          quickInputEl.focus();
        }
      });

      document.getElementById('btn-open-tasks').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/tasks');
      });

      document.getElementById('btn-open-routine').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/routine');
      });

      document.getElementById('btn-close').addEventListener('click', () => {
        window.sarilingPopover?.closePopover();
      });

      document.getElementById('btn-expand').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/');
      });

      document.getElementById('btn-open-app').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/');
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.sarilingPopover?.closePopover();
        }
      });

      if (window.sarilingPopover) {
        window.sarilingPopover.getSnapshot().then(renderSnapshot);
        window.sarilingPopover.onSnapshot(renderSnapshot);
      }
    </script>
  </body>
</html>
