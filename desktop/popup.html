<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sariling Mundo Desktop Sidebar</title>
    <style>
      :root,
      [data-theme='light'] {
        --bg-card: #ffffff;
        --bg-well: #f4f5f8;
        --bg-subwell: #f8f9fb;
        --bg-hover: #eaedf2;
        --text-main: #0d0f14;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-subtle: #e2e5ec;
        --border-strong: #cbd5e1;
        --btn-primary-bg: #0d0f14;
        --btn-primary-fg: #ffffff;
        --btn-primary-hover: #1e2430;
        --pill-bg: #eaedf2;
        --pill-fg: #334155;
        --pill-urgent-bg: #fef2f2;
        --pill-urgent-fg: #b91c1c;
        --pill-urgent-border: #fecaca;
        --pill-work-bg: #fffbeb;
        --pill-work-fg: #b45309;
        --pill-work-border: #fde68a;
        --hand-bg: #0d0f14;
        --hand-fg: #ffffff;
        --hand-ring: rgba(13, 15, 20, 0.08);
        --shadow-card: 0 20px 50px rgba(13, 15, 20, 0.16), 0 4px 14px rgba(13, 15, 20, 0.07);
      }

      [data-theme='dark'] {
        --bg-card: #12151c;
        --bg-well: #1a1e28;
        --bg-subwell: #161a23;
        --bg-hover: #232836;
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-subtle: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.2);
        --btn-primary-bg: #f8fafc;
        --btn-primary-fg: #0d0f14;
        --btn-primary-hover: #e2e8f0;
        --pill-bg: #1e2430;
        --pill-fg: #cbd5e1;
        --pill-urgent-bg: rgba(239, 68, 68, 0.14);
        --pill-urgent-fg: #fca5a5;
        --pill-urgent-border: rgba(239, 68, 68, 0.26);
        --pill-work-bg: rgba(245, 158, 11, 0.14);
        --pill-work-fg: #fcd34d;
        --pill-work-border: rgba(245, 158, 11, 0.28);
        --hand-bg: #f8fafc;
        --hand-fg: #0d0f14;
        --hand-ring: rgba(248, 250, 252, 0.12);
        --shadow-card: 0 22px 52px rgba(0, 0, 0, 0.6), 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        padding: 8px;
        width: 100%;
        height: 100%;
      }

      .panel {
        width: 100%;
        height: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: panelIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes panelIn {
        from {
          opacity: 0;
          transform: translateX(8px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      /* ── Desktop Sidebar Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .brandGroup {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .brandLogo {
        width: 19px;
        height: 19px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .brandTitle {
        font-size: 12.8px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--text-main);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .statusChip {
        display: inline-flex;
        align-items: center;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 9.2px;
        font-weight: 700;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        white-space: nowrap;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        background: var(--pill-bg);
        color: var(--pill-fg);
        border: 1px solid var(--border-subtle);
      }

      .statusChip.work {
        background: var(--pill-work-bg);
        color: var(--pill-work-fg);
        border-color: var(--pill-work-border);
      }

      .statusChip.urgent {
        background: var(--pill-urgent-bg);
        color: var(--pill-urgent-fg);
        border-color: var(--pill-urgent-border);
      }

      .headerActions {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      .iconBtn {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .iconBtn:hover {
        transform: scale(1.05);
        background: var(--bg-well);
        border-color: var(--border-subtle);
        color: var(--text-main);
      }

      .bellDot {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #d97706;
        border: 1.5px solid var(--bg-card);
      }

      .bellDot.urgent {
        background: #dc2626;
      }

      /* ── Formal Segmented Filter Tabs ── */
      .filterTabs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 7px 14px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-well);
        flex-shrink: 0;
      }

      .filterTab {
        flex: 1;
        height: 27px;
        padding: 0 6px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        white-space: nowrap;
        transition: all 0.15s ease;
      }

      .filterTab:hover {
        color: var(--text-main);
        background: var(--bg-hover);
      }

      .filterTab.active {
        background: var(--bg-card);
        color: var(--text-main);
        border-color: var(--border-subtle);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .tabBadge {
        font-size: 9.5px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--pill-bg);
        color: var(--text-secondary);
      }

      /* ── Scrollable Body ── */
      .scrollBody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 13px 14px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }

      .scrollBody::-webkit-scrollbar {
        width: 5px;
      }

      .scrollBody::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 999px;
      }

      /* ── Formal Primary Focus Card ── */
      .focusBox {
        background: var(--bg-well);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .cueRow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .handBadge {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--hand-bg);
        color: var(--hand-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 0 0 3px var(--hand-ring);
      }

      .handIcon {
        width: 17px;
        height: 17px;
        will-change: transform;
      }

      @keyframes gentleCue {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(2px);
        }
      }

      .handBadge.animated .handIcon {
        animation: gentleCue 2s ease-in-out infinite;
      }

      .cueContent {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .cuePrompt {
        font-size: 10.6px;
        font-weight: 650;
        letter-spacing: 0.015em;
        color: var(--text-secondary);
      }

      .cueTitle {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.02em;
        color: var(--text-main);
        word-break: break-word;
      }

      .cueMeta {
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .actionRow {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btnPrimary {
        flex: 1;
        height: 31px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
        font-size: 11.6px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
        transition: background 0.14s ease, transform 0.14s ease;
      }

      .btnPrimary:hover {
        transform: translateY(-1px);
        background: var(--btn-primary-hover);
      }

      .btnPrimary:active {
        transform: scale(0.98);
      }

      .btnGhost {
        height: 31px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 11.6px;
        font-weight: 550;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
        transition: background 0.14s ease, border-color 0.14s ease;
      }

      .btnGhost:hover {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }

      /* ── Desktop Quick-Add Form ── */
      .quickAddForm {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .quickInput {
        flex: 1;
        min-width: 0;
        height: 33px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-well);
        color: var(--text-main);
        font-family: inherit;
        font-size: 11.8px;
        outline: none;
        transition: border-color 0.15s ease, background 0.15s ease;
      }

      .quickInput::placeholder {
        color: var(--text-muted);
      }

      .quickInput:focus {
        border-color: var(--border-strong);
        background: var(--bg-card);
      }

      .quickSubmitBtn {
        height: 33px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 11.6px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.14s ease, border-color 0.14s ease;
      }

      .quickSubmitBtn:hover {
        background: var(--bg-well);
        border-color: var(--border-strong);
      }

      /* ── Formal Section Headers & Collapsible Cards ── */
      .sectionBlock {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .sectionHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10.2px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0 2px;
      }

      .sectionAction {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 10.6px;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 5px;
        border-radius: 5px;
        transition: background 0.12s ease, color 0.12s ease;
      }

      .sectionAction:hover {
        background: var(--bg-well);
        color: var(--text-main);
      }

      .queueList {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .queueGroup {
        border-radius: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        overflow: hidden;
        transition: border-color 0.14s ease, box-shadow 0.14s ease;
      }

      .queueGroup:hover {
        border-color: var(--border-strong);
      }

      .queueGroup.doneRow {
        opacity: 0.64;
      }

      .queueItem {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        transition: background 0.14s ease;
      }

      .queueGroup:hover > .queueItem {
        background: var(--bg-well);
      }

      .queueGroup.doneRow .queueTitle {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .checkCircle {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 1.5px solid var(--border-strong);
        background: transparent;
        color: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
      }

      .checkCircle:hover {
        transform: scale(1.12);
        border-color: var(--text-main);
        background: var(--bg-hover);
        color: var(--text-main);
      }

      .checkCircle.checked {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
      }

      .queueMain {
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }

      .queueTitleRow {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .queueTitle {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }

      .miniTag {
        font-size: 9px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--pill-bg);
        color: var(--pill-fg);
        border: 1px solid var(--border-subtle);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .miniTag.urgent {
        background: var(--pill-urgent-bg);
        color: var(--pill-urgent-fg);
        border-color: var(--pill-urgent-border);
      }

      .miniTag.work {
        background: var(--pill-work-bg);
        color: var(--pill-work-fg);
        border-color: var(--pill-work-border);
      }

      .queueMeta {
        font-size: 10.6px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
        margin-top: 1px;
      }

      .expandBtn {
        height: 24px;
        padding: 0 7px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-well);
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        flex-shrink: 0;
        white-space: nowrap;
        transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
      }

      .expandBtn:hover {
        background: var(--bg-hover);
        border-color: var(--border-strong);
        color: var(--text-main);
      }

      .expandBtn.open {
        background: var(--bg-hover);
        color: var(--text-main);
      }

      .expandChevron {
        width: 11px;
        height: 11px;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .expandBtn.open .expandChevron {
        transform: rotate(180deg);
      }

      /* ── Collapsible Subtasks / Steps Drawer ── */
      .subListWrap {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .subListWrap.open {
        grid-template-rows: 1fr;
      }

      .subListInner {
        overflow: hidden;
      }

      .subList {
        border-top: 1px solid var(--border-subtle);
        background: var(--bg-subwell);
        padding: 5px 8px 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .subItemBtn {
        width: 100%;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 6px;
        border: none;
        background: transparent;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
      }

      .subItemBtn:hover {
        background: var(--bg-hover);
      }

      .subCheck {
        width: 14px;
        height: 14px;
        margin-top: 1px;
        border-radius: 4px;
        border: 1.4px solid var(--border-strong);
        background: var(--bg-card);
        color: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .subItemBtn:hover .subCheck {
        border-color: var(--text-main);
      }

      .subCheck.done {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
      }

      .subLabel {
        flex: 1;
        font-size: 11.2px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--text-secondary);
        word-break: break-word;
      }

      .subItemBtn.done .subLabel {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .dismissBtn {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.6;
        flex-shrink: 0;
        transition: opacity 0.14s ease, background 0.14s ease, color 0.14s ease;
      }

      .queueGroup:hover .dismissBtn {
        opacity: 1;
      }

      .dismissBtn:hover {
        background: var(--bg-hover);
        color: var(--text-main);
      }

      .emptyMini {
        padding: 9px 11px;
        border-radius: 9px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-well);
        font-size: 11.4px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .emptyLink {
        border: none;
        background: transparent;
        color: var(--text-main);
        font-size: 11.2px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }

      .emptyLink:hover {
        text-decoration: underline;
      }

      /* ── Footer ── */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 14px;
        border-top: 1px solid var(--border-subtle);
        background: var(--bg-well);
        flex-shrink: 0;
      }

      .footerStat {
        font-size: 10.8px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .footerLink {
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 7px;
        flex-shrink: 0;
        transition: background 0.14s ease, border-color 0.14s ease;
      }

      .footerLink:hover {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div id="card" class="panel" role="dialog" aria-label="Sariling Mundo Desktop Sidebar">
        <header class="header">
          <div class="brandGroup">
            <img src="logo.png" alt="Sariling Mundo" class="brandLogo" />
            <span class="brandTitle">Sariling Mundo</span>
            <span id="status-chip" class="statusChip">Ready</span>
          </div>
          <div class="headerActions">
            <button
              id="btn-ring"
              type="button"
              class="iconBtn"
              title="Ring & Check Alerts"
              aria-label="Ring & Check Alerts"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
              </svg>
              <span id="bell-dot" class="bellDot hidden" aria-hidden="true"></span>
            </button>
            <button
              id="btn-sound"
              type="button"
              class="iconBtn"
              title="Toggle Alert & Chime Sounds"
              aria-label="Toggle Alert & Chime Sounds"
            >
              <svg id="icon-sound-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />

              </svg>
              <svg id="icon-sound-off" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <line x1="22" y1="9" x2="16" y2="15" />
                <line x1="16" y1="9" x2="22" y2="15" />
              </svg>
            </button>
            <button
              id="btn-expand"
              type="button"
              class="iconBtn"
              title="Open Full Desktop App"

            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6" />
                <path d="M10 14 21 3" />
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              </svg>
            </button>
            <button
              id="btn-close"
              type="button"
              class="iconBtn"
              title="Collapse Edge Sidebar"
              aria-label="Collapse Edge Sidebar"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        </header>

        <!-- Category Tabs -->
        <nav id="filter-tabs" class="filterTabs" aria-label="Sidebar Views">
          <button type="button" class="filterTab active" data-tab="all">All</button>
          <button type="button" class="filterTab" data-tab="tasks">

          </button>
          <button type="button" class="filterTab" data-tab="routine">
            <span>Routine</span>
            <span id="tab-routine-count" class="tabBadge">0/0</span>
          </button>
          <button type="button" class="filterTab" data-tab="reminders">
            <span>Alerts</span>
            <span id="tab-reminders-count" class="tabBadge">0</span>
          </button>
        </nav>

        <main class="scrollBody">
          <!-- Primary Focus Cue Card -->
          <section id="focus-box" class="focusBox" aria-live="polite">
            <div class="cueRow">
              <div id="hand-badge" class="handBadge animated" aria-hidden="true">
                <svg id="icon-hand" class="handIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13 10h7.5a1.5 1.5 0 0 1 0 3H14" />
                  <path d="M14 13h2.2a1.4 1.4 0 0 1 0 2.8H13.5" />
                  <path d="M13.5 15.8h1.5a1.35 1.35 0 0 1 0 2.7H10.5c-2.6 0-4.6-1.2-5.5-2.8L3.5 13V9.5c0-1 .7-1.8 1.6-2l4.4-1a2 2 0 0 1 2.2 1.2L13 10Z" />
                </svg>
                <svg id="icon-check" class="handIcon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 6 9 17l-5-5" />
                </svg>
              </div>

              <div class="cueContent">
                <div id="cue-prompt" class="cuePrompt">Priority focus item</div>
                <div id="cue-title" class="cueTitle">Loading workspace...</div>
                <div id="cue-meta" class="cueMeta"></div>
              </div>
            </div>

            <div id="action-row" class="actionRow">
              <button id="btn-primary" type="button" class="btnPrimary">
                <span>Complete Task</span>
              </button>
              <button id="btn-secondary" type="button" class="btnGhost hidden">
                <span>Focus Space</span>
              </button>
            </div>
          </section>

          <!-- Instant Task Capture -->
          <form id="quick-add-form" class="quickAddForm">
            <input
              id="quick-input"
              type="text"
              class="quickInput"
              placeholder="+ Add task for today..."
              autocomplete="off"
            />
            <button type="submit" class="quickSubmitBtn">Add</button>
          </form>

          <!-- Tasks & Deadlines Section -->
          <section id="tasks-section" class="sectionBlock">
            <div class="sectionHeader">
              <span>Tasks &amp; Deadlines</span>
              <button type="button" id="btn-open-tasks" class="sectionAction">View all →</button>
            </div>
            <div id="tasks-list" class="queueList"></div>
          </section>

          <!-- Daily Routine Section -->
          <section id="routine-section" class="sectionBlock">
            <div class="sectionHeader">
              <span>Daily Routine (<span id="routine-count">0/0</span>)</span>
              <button type="button" id="btn-open-routine" class="sectionAction">Manage →</button>
            </div>
            <div id="routine-list" class="queueList"></div>
          </section>

          <!-- Reminders & Alerts Section -->
          <section id="reminders-section" class="sectionBlock">
            <div class="sectionHeader">
              <span>Reminders &amp; Alerts</span>
              <span id="reminders-count">0</span>
            </div>
            <div id="reminders-list" class="queueList"></div>
          </section>
        </main>

        <footer class="footer">
          <span id="footer-stat" class="footerStat">Synced with workspace</span>
          <button id="btn-open-app" type="button" class="footerLink">
            <span>Open Full App</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </footer>
      </div>
    </div>

    <script>
      const statusChipEl = document.getElementById('status-chip');
      const handBadgeEl = document.getElementById('hand-badge');
      const iconHandEl = document.getElementById('icon-hand');
      const iconCheckEl = document.getElementById('icon-check');
      const cuePromptEl = document.getElementById('cue-prompt');
      const cueTitleEl = document.getElementById('cue-title');
      const cueMetaEl = document.getElementById('cue-meta');
      const actionRowEl = document.getElementById('action-row');
      const btnPrimaryEl = document.getElementById('btn-primary');
      const btnSecondaryEl = document.getElementById('btn-secondary');
      const quickAddFormEl = document.getElementById('quick-add-form');
      const quickInputEl = document.getElementById('quick-input');

      const tabTasksCountEl = document.getElementById('tab-tasks-count');
      const tabRoutineCountEl = document.getElementById('tab-routine-count');
      const tabRemindersCountEl = document.getElementById('tab-reminders-count');
      const focusBoxEl = document.getElementById('focus-box');

      const tasksSectionEl = document.getElementById('tasks-section');
      const tasksListEl = document.getElementById('tasks-list');
      const routineSectionEl = document.getElementById('routine-section');
      const routineCountEl = document.getElementById('routine-count');
      const routineListEl = document.getElementById('routine-list');
      const remindersSectionEl = document.getElementById('reminders-section');
      const remindersCountEl = document.getElementById('reminders-count');
      const remindersListEl = document.getElementById('reminders-list');
      const footerStatEl = document.getElementById('footer-stat');
      const btnRingEl = document.getElementById('btn-ring');
      const bellDotEl = document.getElementById('bell-dot');
      const btnSoundEl = document.getElementById('btn-sound');
      const iconSoundOnEl = document.getElementById('icon-sound-on');
      const iconSoundOffEl = document.getElementById('icon-sound-off');

      let activeTab = 'all';
      let lastSnapshot = null;
      let soundEnabled = true;
      const expandedKeys = new Set();

      // ── Website-Matched Web Audio Feedback (src/utils/soundAndDopamine.ts) ──
      let audioCtx = null;

      function updateSoundButtonUI() {
        iconSoundOnEl.classList.toggle('hidden', !soundEnabled);
        iconSoundOffEl.classList.toggle('hidden', soundEnabled);
        btnSoundEl.title = soundEnabled ? 'Alert Sounds On (Click to mute)' : 'Alert Sounds Muted (Click to unmute)';
      }

      function getSidebarAudioContext() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          return audioCtx;
        } catch {
          return null;
        }
      }

      function playSuccessChime() {
        if (!soundEnabled) return;
        const ctx = getSidebarAudioContext();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const notes = [
            { freq: 523.25, start: now, dur: 0.35, gain: 0.15 },
            { freq: 659.25, start: now + 0.08, dur: 0.4, gain: 0.18 },
            { freq: 783.99, start: now + 0.16, dur: 0.45, gain: 0.2 },
            { freq: 1046.5, start: now + 0.24, dur: 0.7, gain: 0.25 },
          ];
          notes.forEach(({ freq, start, dur, gain }) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            g.gain.setValueAtTime(0.001, start);
            g.gain.linearRampToValueAtTime(gain, start + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + dur + 0.05);
          });
        } catch {}
      }

      function playNotificationRing(tone = 'work', gentle = false, forcePlay = false) {
        if (!forcePlay && !soundEnabled) return;
        const ctx = getSidebarAudioContext();
        if (!ctx) return;
        try {
          const base = ctx.currentTime + 0.01;
          const pattern = gentle
            ? tone === 'urgent'
              ? [
                  { freq: 783.99, offset: 0, dur: 0.22, gain: 0.12 },
                  { freq: 1046.5, offset: 0.1, dur: 0.32, gain: 0.14 },
                ]
              : [
                  { freq: 587.33, offset: 0, dur: 0.24, gain: 0.11 },
                  { freq: 880, offset: 0.1, dur: 0.34, gain: 0.13 },
                ]
            : tone === 'urgent'
            ? [
                { freq: 880, offset: 0, dur: 0.22, gain: 0.19 },
                { freq: 1174.66, offset: 0.11, dur: 0.28, gain: 0.22 },
                { freq: 1318.51, offset: 0.22, dur: 0.36, gain: 0.2 },
                { freq: 880, offset: 0.58, dur: 0.22, gain: 0.17 },
                { freq: 1174.66, offset: 0.69, dur: 0.28, gain: 0.2 },
                { freq: 1318.51, offset: 0.8, dur: 0.42, gain: 0.18 },
              ]
            : [
                { freq: 587.33, offset: 0, dur: 0.26, gain: 0.16 },
                { freq: 783.99, offset: 0.1, dur: 0.3, gain: 0.18 },
                { freq: 987.77, offset: 0.2, dur: 0.35, gain: 0.2 },
                { freq: 1174.66, offset: 0.3, dur: 0.52, gain: 0.16 },
                { freq: 783.99, offset: 0.68, dur: 0.25, gain: 0.13 },
                { freq: 1174.66, offset: 0.79, dur: 0.54, gain: 0.15 },
              ];

          pattern.forEach(({ freq, offset, dur, gain }) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, base + offset);
            g.gain.setValueAtTime(0.001, base + offset);
            g.gain.linearRampToValueAtTime(gain, base + offset + 0.018);
            g.gain.exponentialRampToValueAtTime(0.001, base + offset + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(base + offset);
            osc.stop(base + offset + dur + 0.05);
          });
        } catch {}
      }

      function playSubtaskTick(forcePlay = false) {
        if (!forcePlay && !soundEnabled) return;
        const ctx = getSidebarAudioContext();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1400, now + 0.05);
          g.gain.setValueAtTime(0.12, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } catch {}
      }

      function applyTabVisibility() {
        const ready = Boolean(lastSnapshot && lastSnapshot.ready);
        if (!ready) {
          tasksSectionEl.classList.add('hidden');
          routineSectionEl.classList.add('hidden');
          remindersSectionEl.classList.add('hidden');
          return;
        }
        focusBoxEl.classList.toggle('hidden', activeTab !== 'all');
        tasksSectionEl.classList.toggle('hidden', activeTab !== 'all' && activeTab !== 'tasks');
        routineSectionEl.classList.toggle('hidden', activeTab !== 'all' && activeTab !== 'routine');
        remindersSectionEl.classList.toggle('hidden', activeTab !== 'all' && activeTab !== 'reminders');
      }

      document.querySelectorAll('.filterTab').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeTab = btn.getAttribute('data-tab') || 'all';
          document.querySelectorAll('.filterTab').forEach((b) => b.classList.toggle('active', b === btn));
          applyTabVisibility();
        });
      });

      function renderQueueRow(item) {
        const expandKey = item.kind + ':' + item.id;
        const children =
          item.kind === 'task' && Array.isArray(item.subtasks)
            ? item.subtasks
            : item.kind === 'routine' && Array.isArray(item.steps)
            ? item.steps
            : [];
        const hasChildren = children.length > 0;
        const doneChildrenCount = children.filter((c) => Boolean(c.completed)).length;
        const isExpanded = hasChildren && expandedKeys.has(expandKey);

        const group = document.createElement('div');
        group.className = 'queueGroup' + (item.isDone ? ' doneRow' : '');

        const row = document.createElement('div');
        row.className = 'queueItem';

        if (item.kind !== 'reminder') {
          const checkBtn = document.createElement('button');
          checkBtn.type = 'button';
          checkBtn.className = 'checkCircle' + (item.isDone ? ' checked' : '');
          checkBtn.title = item.isDone ? 'Mark incomplete' : 'Mark complete';
          checkBtn.setAttribute('aria-label', `Toggle ${item.title}`);
          checkBtn.innerHTML =
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
          checkBtn.onclick = async () => {
            checkBtn.disabled = true;
            if (item.kind === 'routine') {
              if (!item.isDone) playSuccessChime();
              else playSubtaskTick();
              await window.sarilingPopover?.toggleRoutineBlock(item.id);
            } else {
              playSuccessChime();
              await window.sarilingPopover?.completeTask(item.id);
            }
          };
          row.appendChild(checkBtn);
        }

        const main = document.createElement('div');
        main.className = 'queueMain';
        main.onclick = () => window.sarilingPopover?.openWorkspace(item.href || (item.kind === 'routine' ? '/routine' : '/tasks'));

        const titleRow = document.createElement('div');
        titleRow.className = 'queueTitleRow';

        if (item.badge) {
          const tag = document.createElement('span');
          tag.className = 'miniTag' + (item.tone === 'urgent' ? ' urgent' : item.tone === 'work' ? ' work' : '');
          tag.textContent = item.badge;
          titleRow.appendChild(tag);
        }

        const title = document.createElement('div');
        title.className = 'queueTitle';
        title.textContent = item.title;
        titleRow.appendChild(title);
        main.appendChild(titleRow);

        if (item.meta) {
          const meta = document.createElement('div');
          meta.className = 'queueMeta';
          meta.textContent = item.meta;
          main.appendChild(meta);
        }

        row.appendChild(main);

        let subWrap = null;
        if (hasChildren) {
          const expandBtn = document.createElement('button');
          expandBtn.type = 'button';
          expandBtn.className = 'expandBtn' + (isExpanded ? ' open' : '');
          expandBtn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
          expandBtn.title = isExpanded ? 'Collapse details' : 'Expand steps';
          expandBtn.innerHTML =
            `<span>${doneChildrenCount}/${children.length}</span>` +
            '<svg class="expandChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

          subWrap = document.createElement('div');
          subWrap.className = 'subListWrap' + (isExpanded ? ' open' : '');
          const subInner = document.createElement('div');
          subInner.className = 'subListInner';
          const subList = document.createElement('div');
          subList.className = 'subList';

          children.forEach((child, cIdx) => {
            const subBtn = document.createElement('button');
            subBtn.type = 'button';
            subBtn.className = 'subItemBtn' + (child.completed ? ' done' : '');

            const subCheck = document.createElement('span');
            subCheck.className = 'subCheck' + (child.completed ? ' done' : '');
            subCheck.innerHTML =
              '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

            const subLabel = document.createElement('span');
            subLabel.className = 'subLabel';
            subLabel.textContent = child.title;

            subBtn.appendChild(subCheck);
            subBtn.appendChild(subLabel);

            subBtn.onclick = async (e) => {
              e.stopPropagation();
              subBtn.disabled = true;
              const willComplete = !child.completed;
              if (item.kind === 'task') {
                const res = await window.sarilingPopover?.toggleSubtask(item.id, child.id);
                if (res && res.allDone) playSuccessChime();
                else if (willComplete) playSubtaskTick();
              } else {
                const stepIdx = typeof child.idx === 'number' ? child.idx : cIdx;
                const res = await window.sarilingPopover?.toggleRoutineStep(item.id, stepIdx);
                if (res && res.blockCompleted) playSuccessChime();
                else if (willComplete) playSubtaskTick();
              }
            };

            subList.appendChild(subBtn);
          });

          subInner.appendChild(subList);
          subWrap.appendChild(subInner);

          expandBtn.onclick = (e) => {
            e.stopPropagation();
            const nowOpen = !subWrap.classList.contains('open');
            subWrap.classList.toggle('open', nowOpen);
            expandBtn.classList.toggle('open', nowOpen);
            expandBtn.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
            if (nowOpen) expandedKeys.add(expandKey);
            else expandedKeys.delete(expandKey);
          };

          row.appendChild(expandBtn);
        }

        if (item.kind === 'reminder') {
          const dismissBtn = document.createElement('button');
          dismissBtn.type = 'button';
          dismissBtn.className = 'dismissBtn';
          dismissBtn.title = 'Dismiss reminder';
          dismissBtn.setAttribute('aria-label', 'Dismiss reminder');
          dismissBtn.innerHTML =
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
          dismissBtn.onclick = async (e) => {
            e.stopPropagation();
            dismissBtn.disabled = true;
            playSubtaskTick();
            await window.sarilingPopover?.dismissReminder(item.id);
          };
          row.appendChild(dismissBtn);
        }

        group.appendChild(row);
        if (subWrap) group.appendChild(subWrap);
        return group;
      }

      function renderSnapshot(data) {
        if (!data) return;
        lastSnapshot = data;
        soundEnabled = data.soundEnabled !== false;
        updateSoundButtonUI();

        document.documentElement.setAttribute('data-theme', data.theme === 'dark' ? 'dark' : 'light');

        const reminderCountForBell = Array.isArray(data.reminderItems) ? data.reminderItems.length : 0;
        const primaryForBell = data.primary || null;
        const hasAlertDot = Boolean(reminderCountForBell > 0 || (primaryForBell && (primaryForBell.tone === 'work' || primaryForBell.tone === 'urgent')));
        bellDotEl.classList.toggle('hidden', !hasAlertDot);
        bellDotEl.classList.toggle('urgent', Boolean(primaryForBell && primaryForBell.tone === 'urgent'));

        const primary = data.primary || null;
        statusChipEl.className = 'statusChip';

        if (!data.ready) {
          handBadgeEl.classList.remove('animated');
          iconHandEl.classList.remove('hidden');
          iconCheckEl.classList.add('hidden');
          statusChipEl.textContent = 'Syncing';
          cuePromptEl.textContent = 'Connecting to workspace';
          cueTitleEl.textContent = data.needsAuth ? 'Sign in to sync your edge sidebar' : 'Loading tasks & schedule...';
          cueMetaEl.textContent = data.needsAuth
            ? 'Open the full app once to sign in.'
            : 'Reading live workspace data.';
          actionRowEl.classList.remove('hidden');
          btnPrimaryEl.innerHTML = '<span>Open Full App</span>';
          btnPrimaryEl.onclick = () => window.sarilingPopover?.openWorkspace('/');
          btnSecondaryEl.classList.add('hidden');
          quickAddFormEl.classList.add('hidden');
          applyTabVisibility();
          footerStatEl.textContent = 'Sariling Mundo Desktop';
          return;
        }

        quickAddFormEl.classList.remove('hidden');

        if (primary) {
          handBadgeEl.classList.add('animated');
          iconHandEl.classList.remove('hidden');
          iconCheckEl.classList.add('hidden');

          statusChipEl.textContent = primary.badge || 'FOCUS';
          if (primary.tone === 'urgent') statusChipEl.classList.add('urgent');
          else if (primary.tone === 'work') statusChipEl.classList.add('work');

          cuePromptEl.textContent = primary.prompt || 'Priority focus item';
          cueTitleEl.textContent = primary.title;
          cueMetaEl.textContent = primary.meta || '';
          cueMetaEl.classList.toggle('hidden', !primary.meta);

          actionRowEl.classList.remove('hidden');
          btnPrimaryEl.innerHTML =
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
            '<span>' + (primary.kind === 'routine' ? 'Complete Block' : 'Complete Task') + '</span>';

          btnPrimaryEl.onclick = async () => {
            btnPrimaryEl.disabled = true;
            try {
              playSuccessChime();
              if (primary.kind === 'routine') {
                await window.sarilingPopover?.toggleRoutineBlock(primary.id);
              } else {
                await window.sarilingPopover?.completeTask(primary.id);
              }
            } finally {
              btnPrimaryEl.disabled = false;
            }
          };

          btnSecondaryEl.classList.remove('hidden');
          btnSecondaryEl.textContent = primary.kind === 'routine' ? 'Open Routine' : 'Focus Space';
          btnSecondaryEl.onclick = () => {
            window.sarilingPopover?.openWorkspace(primary.kind === 'routine' ? '/routine' : '/focus');
          };
        } else {
          handBadgeEl.classList.remove('animated');
          iconHandEl.classList.add('hidden');
          iconCheckEl.classList.remove('hidden');
          statusChipEl.textContent = 'Clear';
          cuePromptEl.textContent = 'All caught up';
          cueTitleEl.textContent = 'No pending tasks or active work blocks';
          cueMetaEl.textContent = 'Add a quick task below or review your Daily Routine.';
          cueMetaEl.classList.remove('hidden');
          actionRowEl.classList.add('hidden');
          btnSecondaryEl.classList.add('hidden');
        }

        // Tasks & Deadlines section
        const taskItems = Array.isArray(data.taskItems) ? data.taskItems : [];
        tabTasksCountEl.textContent = String(taskItems.length);
        tasksListEl.innerHTML = '';
        if (taskItems.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyMini';
          empty.innerHTML = '<span>No pending tasks.</span>';
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'emptyLink';
          addBtn.textContent = '+ Add';
          addBtn.onclick = () => quickInputEl.focus();
          empty.appendChild(addBtn);
          tasksListEl.appendChild(empty);
        } else {
          taskItems.forEach((item) => tasksListEl.appendChild(renderQueueRow(item)));
        }

        // Daily Routine section
        const routineItems = Array.isArray(data.routineItems) ? data.routineItems : [];
        const rDone = data.routineSummary ? data.routineSummary.done : 0;
        const rTotal = data.routineSummary ? data.routineSummary.total : 0;
        routineCountEl.textContent = `${rDone}/${rTotal}`;
        tabRoutineCountEl.textContent = `${rDone}/${rTotal}`;
        routineListEl.innerHTML = '';
        if (rTotal === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyMini';
          empty.innerHTML = '<span>No routine blocks set.</span>';
          const setupBtn = document.createElement('button');
          setupBtn.type = 'button';
          setupBtn.className = 'emptyLink';
          setupBtn.textContent = 'Set up →';
          setupBtn.onclick = () => window.sarilingPopover?.openWorkspace('/routine');
          empty.appendChild(setupBtn);
          routineListEl.appendChild(empty);
        } else {
          routineItems.forEach((item) => routineListEl.appendChild(renderQueueRow(item)));
        }

        // Reminders & Alerts section
        const reminderItems = Array.isArray(data.reminderItems) ? data.reminderItems : [];
        remindersCountEl.textContent = String(reminderItems.length);
        tabRemindersCountEl.textContent = String(reminderItems.length);
        remindersListEl.innerHTML = '';
        if (reminderItems.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyMini';
          empty.innerHTML = '<span>All reminders clear.</span>';
          const calBtn = document.createElement('button');
          calBtn.type = 'button';
          calBtn.className = 'emptyLink';
          calBtn.textContent = 'Calendar →';
          calBtn.onclick = () => window.sarilingPopover?.openWorkspace('/calendar');
          empty.appendChild(calBtn);
          remindersListEl.appendChild(empty);
        } else {
          reminderItems.forEach((item) => remindersListEl.appendChild(renderQueueRow(item)));
        }

        applyTabVisibility();
        footerStatEl.textContent = data.summary || 'Synced with workspace';
      }

      quickAddFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = quickInputEl.value.trim();
        if (!title) return;
        quickInputEl.disabled = true;
        try {
          playSubtaskTick();
          await window.sarilingPopover?.addTask(title);
          quickInputEl.value = '';
        } finally {
          quickInputEl.disabled = false;
          quickInputEl.focus();
        }
      });

      document.getElementById('btn-open-tasks').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/tasks');
      });

      document.getElementById('btn-open-routine').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/routine');
      });

      document.getElementById('btn-close').addEventListener('click', () => {
        window.sarilingPopover?.closePopover();
      });

      document.getElementById('btn-expand').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/');
      });

      document.getElementById('btn-open-app').addEventListener('click', () => {
        window.sarilingPopover?.openWorkspace('/');
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.sarilingPopover?.closePopover();
        }
      });

      btnRingEl.addEventListener('click', async () => {
        const res = await window.sarilingPopover?.ringNow();
        const tone = (res && res.tone) || (lastSnapshot && lastSnapshot.primary && lastSnapshot.primary.tone) || 'work';
        playNotificationRing(tone, false, true);
        if (lastSnapshot && Array.isArray(lastSnapshot.reminderItems) && lastSnapshot.reminderItems.length > 0) {
          const alertsBtn = document.querySelector('.filterTab[data-tab="reminders"]');
          if (alertsBtn) {
            activeTab = 'reminders';
            document.querySelectorAll('.filterTab').forEach((b) => b.classList.toggle('active', b === alertsBtn));
            applyTabVisibility();
          }
        }
      });

      btnSoundEl.addEventListener('click', async () => {
        const nextVal = !soundEnabled;
        soundEnabled = nextVal;
        updateSoundButtonUI();
        if (nextVal) playSubtaskTick(true);
        const res = await window.sarilingPopover?.setSoundEnabled(nextVal);
        if (res && typeof res.soundEnabled === 'boolean') {
          soundEnabled = res.soundEnabled;
          updateSoundButtonUI();
        }
      });

      if (window.sarilingPopover) {
        window.sarilingPopover.getSnapshot().then(renderSnapshot);
        window.sarilingPopover.onSnapshot(renderSnapshot);
        window.sarilingPopover.onOpened?.((data) => {
          if (!data || !data.ready) return;
          soundEnabled = data.soundEnabled !== false;
          updateSoundButtonUI();
          if (!soundEnabled) return;
          const alertsCount = Array.isArray(data.reminderItems) ? data.reminderItems.length : 0;
          const primaryTone = data.primary && data.primary.tone;
          if (primaryTone === 'urgent' || primaryTone === 'work' || alertsCount > 0) {
            playNotificationRing(primaryTone || 'work', true);
          }
        });
      }
    </script>
  </body>
</html>
