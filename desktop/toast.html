<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sariling Mundo Reminder</title>
    <style>
      :root,
      [data-theme='light'] {
        --bg-card: #ffffff;
        --bg-well: #f4f5f8;
        --bg-hover: #eaedf2;
        --text-main: #0d0f14;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-subtle: #e2e5ec;
        --btn-primary-bg: #0d0f14;
        --btn-primary-fg: #ffffff;
        --badge-work-bg: #fffbeb;
        --badge-work-fg: #b45309;
        --badge-work-border: #fde68a;
        --badge-urgent-bg: #fef2f2;
        --badge-urgent-fg: #b91c1c;
        --badge-urgent-border: #fecaca;
        --hand-bg: #0d0f14;
        --hand-fg: #ffffff;
        --hand-ring: rgba(13, 15, 20, 0.14);
        --shadow: 0 16px 38px rgba(13, 15, 20, 0.2), 0 4px 12px rgba(13, 15, 20, 0.08);
      }

      [data-theme='dark'] {
        --bg-card: #12151c;
        --bg-well: #1a1e28;
        --bg-hover: #232836;
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-subtle: rgba(255, 255, 255, 0.14);
        --btn-primary-bg: #f8fafc;
        --btn-primary-fg: #0d0f14;
        --badge-work-bg: rgba(245, 158, 11, 0.16);
        --badge-work-fg: #fcd34d;
        --badge-work-border: rgba(245, 158, 11, 0.3);
        --badge-urgent-bg: rgba(239, 68, 68, 0.16);
        --badge-urgent-fg: #fca5a5;
        --badge-urgent-border: rgba(239, 68, 68, 0.3);
        --hand-bg: #f8fafc;
        --hand-fg: #0d0f14;
        --hand-ring: rgba(248, 250, 252, 0.16);
        --shadow: 0 18px 42px rgba(0, 0, 0, 0.62), 0 4px 12px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        padding: 7px;
        width: 100%;
        height: 100%;
      }

      .toastCard {
        width: 100%;
        height: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 15px;
        box-shadow: var(--shadow);
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
        animation: slideIn 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(12px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .topRow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .handBadge {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--hand-bg);
        color: var(--hand-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 0 0 4px var(--hand-ring);
      }

      .handIcon {
        width: 18px;
        height: 18px;
        animation: ringWiggle 1.1s ease-in-out infinite;
      }

      @keyframes ringWiggle {
        0%,
        100% {
          transform: rotate(0deg);
        }
        15% {
          transform: rotate(-12deg);
        }
        30% {
          transform: rotate(12deg);
        }
        45% {
          transform: rotate(-8deg);
        }
        60% {
          transform: rotate(6deg);
        }
        75% {
          transform: rotate(0deg);
        }
      }

      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .metaHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 1.5px 6px;
        border-radius: 999px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        white-space: nowrap;
        background: var(--bg-well);
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
      }

      .badge.work {
        background: var(--badge-work-bg);
        color: var(--badge-work-fg);
        border-color: var(--badge-work-border);
      }

      .badge.urgent {
        background: var(--badge-urgent-bg);
        color: var(--badge-urgent-fg);
        border-color: var(--badge-urgent-border);
      }

      .closeBtn {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .closeBtn:hover {
        background: var(--bg-well);
        color: var(--text-main);
      }

      .headline {
        font-size: 12.5px;
        font-weight: 650;
        color: var(--text-main);
        line-height: 1.3;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .subTitle {
        font-size: 11.4px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btnDoNow {
        flex: 1;
        height: 28px;
        border-radius: 8px;
        border: none;
        background: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
      }

      .btnDoNow:hover {
        opacity: 0.92;
      }

      .btnLater {
        height: 28px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-secondary);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
      }

      .btnLater:hover {
        background: var(--bg-hover);
        color: var(--text-main);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div id="toast-card" class="toastCard" role="status" aria-live="polite">
        <div class="topRow">
          <div class="handBadge" aria-hidden="true">
            <svg class="handIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
            </svg>
          </div>
          <div class="content">
            <div class="metaHeader">
              <span id="toast-badge" class="badge work">WORK TIME</span>
              <button id="btn-close" type="button" class="closeBtn" title="Dismiss" aria-label="Dismiss">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>
            <div id="toast-headline" class="headline">Work time is running</div>
            <div id="toast-sub" class="subTitle">Open to view your focus item</div>
          </div>
        </div>
        <div class="actions">
          <button id="btn-open" type="button" class="btnDoNow">View &amp; Start</button>
          <button id="btn-later" type="button" class="btnLater">15m</button>
        </div>
      </div>
    </div>

    <script>
      const cardEl = document.getElementById('toast-card');
      const badgeEl = document.getElementById('toast-badge');
      const headlineEl = document.getElementById('toast-headline');
      const subEl = document.getElementById('toast-sub');

      let activeAlertKey = null;
      let toastAudioCtx = null;
      let activeRingNodes = [];

      function getToastAudioContext() {
        try {
          if (!toastAudioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) toastAudioCtx = new Ctx();
          }
          if (toastAudioCtx && toastAudioCtx.state === 'suspended') {
            void toastAudioCtx.resume();
          }
          return toastAudioCtx;
        } catch {
          return null;
        }
      }

      function stopAlertRing() {
        for (const node of activeRingNodes) {
          try {
            node.stop();
          } catch {}
        }
        activeRingNodes = [];
      }

      function playNotificationRing(tone) {
        stopAlertRing();
        const ctx = getToastAudioContext();
        if (!ctx) return;
        try {
          const base = ctx.currentTime + 0.02;
          // Distinct, executive desk-bell ring sequence
          const pattern =
            tone === 'urgent'
              ? [
                  { freq: 880, offset: 0, dur: 0.22, gain: 0.2 },
                  { freq: 1174.66, offset: 0.11, dur: 0.28, gain: 0.24 },
                  { freq: 1318.51, offset: 0.22, dur: 0.38, gain: 0.22 },
                  { freq: 880, offset: 0.62, dur: 0.22, gain: 0.18 },
                  { freq: 1174.66, offset: 0.73, dur: 0.28, gain: 0.22 },
                  { freq: 1318.51, offset: 0.84, dur: 0.45, gain: 0.2 },
                ]
              : tone === 'work'
              ? [
                  { freq: 587.33, offset: 0, dur: 0.28, gain: 0.17 },
                  { freq: 783.99, offset: 0.1, dur: 0.32, gain: 0.2 },
                  { freq: 987.77, offset: 0.2, dur: 0.38, gain: 0.22 },
                  { freq: 1174.66, offset: 0.3, dur: 0.55, gain: 0.18 },
                  { freq: 783.99, offset: 0.72, dur: 0.28, gain: 0.14 },
                  { freq: 1174.66, offset: 0.84, dur: 0.6, gain: 0.16 },
                ]
              : [
                  { freq: 659.25, offset: 0, dur: 0.32, gain: 0.16 },
                  { freq: 987.77, offset: 0.12, dur: 0.52, gain: 0.18 },
                ];

          pattern.forEach(({ freq, offset, dur, gain }) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, base + offset);
            g.gain.setValueAtTime(0.001, base + offset);
            g.gain.linearRampToValueAtTime(gain, base + offset + 0.018);
            g.gain.exponentialRampToValueAtTime(0.001, base + offset + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(base + offset);
            osc.stop(base + offset + dur + 0.05);
            activeRingNodes.push(osc);
          });
        } catch {}
      }

      function applyToast(payload) {
        if (!payload) return;
        document.documentElement.setAttribute('data-theme', payload.theme === 'dark' ? 'dark' : 'light');
        activeAlertKey = payload.alertKey || null;

        badgeEl.className = 'badge';
        if (payload.tone === 'urgent') badgeEl.classList.add('urgent');
        else if (payload.tone === 'work') badgeEl.classList.add('work');

        badgeEl.textContent = payload.badge || 'REMINDER';
        headlineEl.textContent = payload.headline || 'Focus item waiting';
        subEl.textContent = payload.sub || '';

        if (payload.soundEnabled !== false && payload.ring !== false) {
          playNotificationRing(payload.tone || 'work');
        }
      }

      document.getElementById('btn-open').addEventListener('click', () => {
        stopAlertRing();
        window.sarilingToast?.openPopover();
      });

      document.getElementById('btn-later').addEventListener('click', () => {
        stopAlertRing();
        window.sarilingToast?.snooze(activeAlertKey);
      });

      document.getElementById('btn-close').addEventListener('click', () => {
        stopAlertRing();
        window.sarilingToast?.dismiss(activeAlertKey);
      });

      cardEl.addEventListener('mouseenter', () => {
        window.sarilingToast?.setHovered(true);
      });
      cardEl.addEventListener('mouseleave', () => {
        window.sarilingToast?.setHovered(false);
      });

      if (window.sarilingToast) {
        window.sarilingToast.onShow(applyToast);
      }
    </script>
  </body>
</html>
