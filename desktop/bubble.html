<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sariling Mundo Quick Bubble</title>
  <style>
    :root {
      --edge-line-bg: rgba(71, 85, 105, 0.72);
      --edge-line-work-bg: #334155;
      --edge-line-border: rgba(255, 255, 255, 0.34);
      --edge-line-glow: rgba(15, 23, 42, 0.28);
      --edge-hover-bg: rgba(15, 23, 42, 0.95);
      --edge-hover-border: rgba(255, 255, 255, 0.28);
      --edge-pip-color: #64748b;
    }

    [data-theme='dark'] {
      --edge-line-bg: rgba(148, 163, 184, 0.66);
      --edge-line-work-bg: #cbd5e1;
      --edge-line-border: rgba(255, 255, 255, 0.24);
      --edge-line-glow: rgba(148, 163, 184, 0.28);
      --edge-hover-bg: rgba(19, 22, 31, 0.96);
      --edge-hover-border: rgba(255, 255, 255, 0.28);
      --edge-pip-color: #94a3b8;
    }

    /* ── Synced Theme Palettes (Light + Dark) ── */
    :root[data-color-theme='ocean'] {
      --edge-line-bg: #2563eb;
      --edge-line-work-bg: #1d4ed8;
      --edge-line-border: rgba(191, 219, 254, 0.72);
      --edge-line-glow: rgba(37, 99, 235, 0.52);
      --edge-hover-bg: #1d4ed8;
      --edge-hover-border: rgba(191, 219, 254, 0.75);
      --edge-pip-color: #3b82f6;
    }
    [data-theme='dark'][data-color-theme='ocean'] {
      --edge-line-bg: #60a5fa;
      --edge-line-work-bg: #3b82f6;
      --edge-line-border: rgba(191, 219, 254, 0.65);
      --edge-line-glow: rgba(96, 165, 250, 0.56);
      --edge-hover-bg: #173459;
      --edge-hover-border: #60a5fa;
      --edge-pip-color: #60a5fa;
    }

    :root[data-color-theme='sage'] {
      --edge-line-bg: #1b6b4a;
      --edge-line-work-bg: #15803d;
      --edge-line-border: rgba(187, 247, 208, 0.7);
      --edge-line-glow: rgba(27, 107, 74, 0.5);
      --edge-hover-bg: #1b6b4a;
      --edge-hover-border: rgba(187, 247, 208, 0.75);
      --edge-pip-color: #22c55e;
    }
    [data-theme='dark'][data-color-theme='sage'] {
      --edge-line-bg: #52b788;
      --edge-line-work-bg: #40916c;
      --edge-line-border: rgba(183, 228, 199, 0.62);
      --edge-line-glow: rgba(82, 183, 136, 0.54);
      --edge-hover-bg: #173b2c;
      --edge-hover-border: #52b788;
      --edge-pip-color: #52b788;
    }

    :root[data-color-theme='sand'] {
      --edge-line-bg: #8c4a19;
      --edge-line-work-bg: #a65b21;
      --edge-line-border: rgba(253, 230, 138, 0.65);
      --edge-line-glow: rgba(140, 74, 25, 0.5);
      --edge-hover-bg: #8c4a19;
      --edge-hover-border: rgba(253, 230, 138, 0.7);
      --edge-pip-color: #d97706;
    }
    [data-theme='dark'][data-color-theme='sand'] {
      --edge-line-bg: #e09f5a;
      --edge-line-work-bg: #cc8b45;
      --edge-line-border: rgba(253, 230, 138, 0.6);
      --edge-line-glow: rgba(224, 159, 90, 0.54);
      --edge-hover-bg: #38281c;
      --edge-hover-border: #e09f5a;
      --edge-pip-color: #e09f5a;
    }

    :root[data-color-theme='indigo'] {
      --edge-line-bg: #4f46e5;
      --edge-line-work-bg: #4338ca;
      --edge-line-border: rgba(199, 210, 254, 0.72);
      --edge-line-glow: rgba(79, 70, 229, 0.54);
      --edge-hover-bg: #4338ca;
      --edge-hover-border: rgba(199, 210, 254, 0.78);
      --edge-pip-color: #6366f1;
    }
    [data-theme='dark'][data-color-theme='indigo'] {
      --edge-line-bg: #818cf8;
      --edge-line-work-bg: #6366f1;
      --edge-line-border: rgba(199, 210, 254, 0.65);
      --edge-line-glow: rgba(129, 140, 248, 0.56);
      --edge-hover-bg: #262359;
      --edge-hover-border: #818cf8;
      --edge-pip-color: #818cf8;
    }

    :root[data-color-theme='teal'] {
      --edge-line-bg: #0d8278;
      --edge-line-work-bg: #0d6e66;
      --edge-line-border: rgba(153, 246, 228, 0.7);
      --edge-line-glow: rgba(13, 130, 120, 0.52);
      --edge-hover-bg: #0d6e66;
      --edge-hover-border: rgba(153, 246, 228, 0.75);
      --edge-pip-color: #14b8a6;
    }
    [data-theme='dark'][data-color-theme='teal'] {
      --edge-line-bg: #2dd4bf;
      --edge-line-work-bg: #14b8a6;
      --edge-line-border: rgba(153, 246, 228, 0.65);
      --edge-line-glow: rgba(45, 212, 191, 0.56);
      --edge-hover-bg: #163b42;
      --edge-hover-border: #2dd4bf;
      --edge-pip-color: #2dd4bf;
    }

    :root[data-color-theme='rose'] {
      --edge-line-bg: #be2e5b;
      --edge-line-work-bg: #a32a50;
      --edge-line-border: rgba(251, 207, 232, 0.7);
      --edge-line-glow: rgba(190, 46, 91, 0.52);
      --edge-hover-bg: #a32a50;
      --edge-hover-border: rgba(251, 207, 232, 0.75);
      --edge-pip-color: #ec4899;
    }
    [data-theme='dark'][data-color-theme='rose'] {
      --edge-line-bg: #f47296;
      --edge-line-work-bg: #ec4878;
      --edge-line-border: rgba(251, 207, 232, 0.65);
      --edge-line-glow: rgba(244, 114, 150, 0.56);
      --edge-hover-bg: #40202e;
      --edge-hover-border: #f47296;
      --edge-pip-color: #f47296;
    }

    :root[data-color-theme='plum'] {
      --edge-line-bg: #7c3aed;
      --edge-line-work-bg: #6b26c4;
      --edge-line-border: rgba(221, 214, 254, 0.72);
      --edge-line-glow: rgba(124, 58, 237, 0.54);
      --edge-hover-bg: #6b26c4;
      --edge-hover-border: rgba(221, 214, 254, 0.78);
      --edge-pip-color: #8b5cf6;
    }
    [data-theme='dark'][data-color-theme='plum'] {
      --edge-line-bg: #b388ff;
      --edge-line-work-bg: #9c66ff;
      --edge-line-border: rgba(221, 214, 254, 0.65);
      --edge-line-glow: rgba(179, 136, 255, 0.56);
      --edge-hover-bg: #342054;
      --edge-hover-border: #b388ff;
      --edge-pip-color: #b388ff;
    }

    :root[data-color-theme='olive'] {
      --edge-line-bg: #4d701e;
      --edge-line-work-bg: #44611b;
      --edge-line-border: rgba(217, 249, 157, 0.7);
      --edge-line-glow: rgba(77, 112, 30, 0.52);
      --edge-hover-bg: #44611b;
      --edge-hover-border: rgba(217, 249, 157, 0.75);
      --edge-pip-color: #65a30d;
    }
    [data-theme='dark'][data-color-theme='olive'] {
      --edge-line-bg: #a3c962;
      --edge-line-work-bg: #8eb54c;
      --edge-line-border: rgba(217, 249, 157, 0.62);
      --edge-line-glow: rgba(163, 201, 98, 0.54);
      --edge-hover-bg: #273a1b;
      --edge-hover-border: #a3c962;
      --edge-pip-color: #a3c962;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Design 1: Minimalist Obsidian Circle Bubble ── */
    .circleBubble {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--edge-hover-bg);
      border: 1px solid var(--edge-hover-border);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.34),
        0 0 12px var(--edge-line-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .circleBubble:hover {
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.65);
    }

    .circleBubble.active {
      border-color: rgba(255, 255, 255, 0.78);
    }

    .circleBubble:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    .circleLogo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      pointer-events: none;
    }

    .statusPip {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--edge-pip-color);
      border: 2px solid #0d0f14;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .circleBubble.hasWork .statusPip {
      background: var(--edge-line-bg);
    }

    @keyframes pipBlinkSynced {
      0%, 100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 8px var(--edge-line-glow); }
      50% { opacity: 0.32; transform: scale(0.85); box-shadow: none; }
    }

    .circleBubble.blinking .statusPip {
      background: var(--edge-line-bg);
      animation: pipBlinkSynced 1.2s ease-in-out infinite;
    }

    .circleBubble.blinking.urgent .statusPip {
      animation: pipBlinkSynced 0.9s ease-in-out infinite;
    }

    .circleBubble.active .statusPip {
      background: #ffffff;
      animation: none;
    }

    /* ── Design 2: Minimalist Screen-Edge Panel Handle ── */
    .edgeStage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .edgeStage.left {
      justify-content: flex-start;
    }

    .edgeStage.right {
      justify-content: flex-end;
    }

    .edgeLineHandle {
      position: relative;
      width: 14px;
      height: 74px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: width 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .edgeStage.left .edgeLineHandle {
      justify-content: flex-start;
    }

    .edgeStage.right .edgeLineHandle {
      justify-content: flex-end;
    }

    .edgeSliver {
      width: 5px;
      height: 58px;
      background: var(--edge-line-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--edge-line-border);
      box-shadow: 0 2px 10px var(--edge-line-glow);
      opacity: 0.82;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition:
        width 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.18s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .edgeStage.left .edgeSliver {
      border-radius: 0 10px 10px 0;
      border-left: none;
    }

    .edgeStage.right .edgeSliver {
      border-radius: 10px 0 0 10px;
      border-right: none;
    }

    .edgeLineHandle.hasWork .edgeSliver {
      background: var(--edge-line-bg);
      opacity: 0.92;
    }

    @keyframes edgeBlinkSynced {
      0%, 100% {
        opacity: 1;
        background: var(--edge-line-bg);
        border-color: var(--edge-line-border);
        box-shadow: 0 0 14px var(--edge-line-glow), 0 0 4px var(--edge-line-glow);
      }
      50% {
        opacity: 0.34;
        background: var(--edge-line-work-bg);
        border-color: var(--edge-line-border);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
      }
    }

    .edgeLineHandle.blinking:not(:hover):not(.active) .edgeSliver {
      width: 6px;
      height: 64px;
      animation: edgeBlinkSynced 1.35s ease-in-out infinite;
    }

    .edgeLineHandle.blinking.urgent:not(:hover):not(.active) .edgeSliver {
      animation: edgeBlinkSynced 0.95s ease-in-out infinite;
    }

    .edgeLineHandle:hover,
    .edgeLineHandle.active {
      width: 30px;
    }

    .edgeLineHandle:hover .edgeSliver,
    .edgeLineHandle.active .edgeSliver {
      width: 28px;
      height: 68px;
      opacity: 1;
      background: var(--edge-hover-bg);
      border-color: var(--edge-hover-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.36), 0 0 14px var(--edge-line-glow);
      animation: none;
    }

    .edgeMiniLogo {
      width: 16px;
      height: 16px;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.14s ease, transform 0.16s ease;
      pointer-events: none;
    }

    .edgeLineHandle:hover .edgeMiniLogo,
    .edgeLineHandle.active .edgeMiniLogo {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Design 3: Minimalist Pill Badge ── */
    .pillHandle {
      height: 38px;
      padding: 0 12px 0 9px;
      border-radius: 999px;
      background: var(--edge-hover-bg);
      border: 1px solid var(--edge-hover-border);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32), 0 0 12px var(--edge-line-glow);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      cursor: grab;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .pillHandle:hover {
      transform: scale(1.02);
      border-color: rgba(255, 255, 255, 0.62);
    }

    .pillHandle:active {
      cursor: grabbing;
      transform: scale(0.97);
    }

    .pillLogo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      pointer-events: none;
    }

    .pillLabel {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .pillDot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--edge-pip-color);
      flex-shrink: 0;
    }

    .pillHandle.hasWork .pillDot {
      background: var(--edge-line-bg);
    }

    .pillHandle.blinking .pillDot {
      background: var(--edge-line-bg);
      animation: pipBlinkSynced 1.2s ease-in-out infinite;
    }

    .pillHandle.blinking.urgent .pillDot {
      animation: pipBlinkSynced 0.9s ease-in-out infinite;
    }

    .pillHandle.active .pillDot {
      background: #ffffff;
      animation: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="root" class="stage">
    <!-- Mode: Circle Bubble -->
    <div id="mode-circle" class="circleBubble"
      title="Click for Edge Sidebar · Drag to move · Swipe to edge for Edge Handle · Right-click for styles">
      <img src="logo.png" alt="Sariling Mundo" class="circleLogo" />
      <span class="statusPip"></span>
    </div>

    <!-- Mode: Edge Line (Swipe / Click) -->
    <div id="mode-line" class="edgeStage right hidden">
      <div id="edge-handle" class="edgeLineHandle"
        title="Click or swipe inward for Edge Sidebar · Drag up/down to move · Right-click for styles">
        <span class="edgeSliver">
          <img src="logo.png" alt="Sariling Mundo" class="edgeMiniLogo" />
        </span>
      </div>
    </div>

    <!-- Mode: Compact Pill -->
    <div id="mode-pill" class="pillHandle hidden"
      title="Click for Edge Sidebar · Drag to move · Right-click for styles">
      <img src="logo.png" alt="Sariling Mundo" class="pillLogo" />
      <span id="pill-label" class="pillLabel">Sariling Mundo</span>
      <span class="pillDot"></span>
    </div>
  </div>

  <script>
    const elCircle = document.getElementById('mode-circle');
    const elLineWrap = document.getElementById('mode-line');
    const elLineHandle = document.getElementById('edge-handle');
    const elPill = document.getElementById('mode-pill');
    const elPillLabel = document.getElementById('pill-label');

    let currentState = {
      mode: 'circle',
      edge: 'right',
      popoverVisible: false,
      hasWork: false,
      isBlinking: false,
      blinkMuted: false,
      blinkPaused: false,
      workTone: 'neutral',
      pillText: 'Sariling Mundo',
    };

    function applyState(state) {
      if (!state) return;
      currentState = state;

      document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-color-theme', state.colorTheme || 'slate');

      elCircle.classList.toggle('hidden', state.mode !== 'circle');
      elLineWrap.classList.toggle('hidden', state.mode !== 'line');
      elPill.classList.toggle('hidden', state.mode !== 'pill');

      elLineWrap.classList.toggle('left', state.edge === 'left');
      elLineWrap.classList.toggle('right', state.edge !== 'left');

      const isActive = Boolean(state.popoverVisible);
      const hasWork = Boolean(state.hasWork);
      const isBlinking = Boolean(state.isBlinking);
      const isUrgent = state.workTone === 'urgent';

      elCircle.classList.toggle('active', isActive);
      elCircle.classList.toggle('hasWork', hasWork);
      elCircle.classList.toggle('blinking', isBlinking);
      elCircle.classList.toggle('urgent', isUrgent);

      elLineHandle.classList.toggle('active', isActive);
      elLineHandle.classList.toggle('hasWork', hasWork);
      elLineHandle.classList.toggle('blinking', isBlinking);
      elLineHandle.classList.toggle('urgent', isUrgent);

      elPill.classList.toggle('active', isActive);
      elPill.classList.toggle('hasWork', hasWork);
      elPill.classList.toggle('blinking', isBlinking);
      elPill.classList.toggle('urgent', isUrgent);

      if (elLineHandle) {
        if (isBlinking) {
          elLineHandle.title =
            'Pending task or routine — Click to view or Right-click to Stop / Mute blinking';
        } else if (hasWork && (state.blinkMuted || state.blinkPaused)) {
          elLineHandle.title =
            'Pending work (blinking stopped/muted) — Click to view or Right-click to Resume';
        } else {
          elLineHandle.title =
            'Click or swipe inward for Edge Sidebar · Drag up/down to move · Right-click for styles';
        }
      }

      if (state.pillText && elPillLabel) {
        elPillLabel.textContent = state.pillText;
      }
    }

    if (window.sarilingBubble) {
      window.sarilingBubble.getState().then(applyState);
      window.sarilingBubble.onState(applyState);
    }

    let pointerDown = null;

    function attachInteractions(targetEl, isEdgeLine = false) {
      targetEl.addEventListener('pointerdown', (e) => {
        if (e.button === 2) return;
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        pointerDown = {
          startScreenX: e.screenX,
          startScreenY: e.screenY,
          moved: false,
          isEdgeLine,
        };
        try {
          targetEl.setPointerCapture(e.pointerId);
        } catch { }
        window.sarilingBubble?.dragStart(e.screenX, e.screenY);
      });

      targetEl.addEventListener('pointermove', (e) => {
        if (!pointerDown) return;
        const dx = e.screenX - pointerDown.startScreenX;
        const dy = e.screenY - pointerDown.startScreenY;

        // Swipe inward on edge line immediately opens the compact popover
        if (pointerDown.isEdgeLine && Math.abs(dx) > 16) {
          const swipedInward =
            (currentState.edge === 'right' && dx < -16) ||
            (currentState.edge === 'left' && dx > 16);
          if (swipedInward) {
            pointerDown = null;
            window.sarilingBubble?.togglePopover();
            return;
          }
        }

        if (Math.hypot(dx, dy) > 6) {
          pointerDown.moved = true;
          window.sarilingBubble?.dragMove(e.screenX, e.screenY);
        }
      });

      targetEl.addEventListener('pointerup', (e) => {
        if (!pointerDown) return;
        const wasMoved = pointerDown.moved;
        pointerDown = null;
        try {
          targetEl.releasePointerCapture(e.pointerId);
        } catch { }
        if (wasMoved) {
          window.sarilingBubble?.dragEnd(e.screenX, e.screenY);
        } else {
          window.sarilingBubble?.togglePopover();
        }
      });

      targetEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        window.sarilingBubble?.openContextMenu();
      });
    }

    attachInteractions(elCircle, false);
    attachInteractions(elLineHandle, true);
    attachInteractions(elPill, false);
  </script>
</body>

</html>
